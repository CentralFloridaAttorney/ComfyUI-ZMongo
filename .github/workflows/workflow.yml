name: ComfyUI-ZMongo CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  lint-and-test:
    name: Lint & Test Node (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Development and Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black pytest pytest-asyncio

      - name: Install Repository Dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with Ruff
        run: |
          # Fails the build if syntax errors or undefined names are found
          ruff check . --select=E9,F63,F7,F82 --show-source
          # Continues with warnings for stylistic issues
          ruff check . --exit-zero

      - name: Check Formatting with Black
        run: |
          black --check . || echo "Black formatting issues found. Run 'black .' locally to fix."

      # Spin up a temporary MongoDB instance for running integration tests
      - name: Start MongoDB Service
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: '6.0'
          mongodb-port: 27017

      # Run your unit/integration tests (assuming they use pytest)
      - name: Run Tests
        env:
          MONGO_URI: mongodb://localhost:27017/
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -v
          else
            echo "No 'tests/' directory found. Skipping pytest."
          fi