[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zmongo-nodes"
version = "0.1.3"
description = "Advanced database framework, parameter library, and local file store persistence engine for ComfyUI."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
authors = [
    { name = "CentralFloridaAttorney" }
]
keywords = [
    "comfyui",
    "custom-nodes",
    "zmongo",
    "database",
    "workflow-presets",
    "local-file-store",
    "gemini",
    "document-automation"
]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]

dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "aiohttp>=3.9",
    "google-genai>=1.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "numpy>=1.26"
]

[project.optional-dependencies]
mongo = [
    "motor>=3.4",
    "pymongo>=4.6"
]
server = [
    "quart>=0.19",
    "werkzeug>=3.0",
    "bcrypt>=4.1"
]
agents = [
    "langchain>=0.2",
    "langchain-community>=0.2",
    "pandas>=2.0"
]
embeddings = [
    "FlagEmbedding",
    "transformers>=4.40"
]
full = [com
    "motor>=3.4",
    "pymongo>=4.6",
    "quart>=0.19",
    "werkzeug>=3.0",
    "bcrypt>=4.1",
    "langchain>=0.2",
    "langchain-community>=0.2",
    "pandas>=2.0",
    "FlagEmbedding",
    "transformers>=4.40"
]

[project.urls]
Repository = "https://github.com/CentralFloridaAttorney/ComfyUI-ZMongo"
Documentation = "https://github.com/CentralFloridaAttorney/ComfyUI-ZMongo#readme"
Issues = "https://github.com/CentralFloridaAttorney/ComfyUI-ZMongo/issues"

[tool.comfy]
PublisherId = "centralfloridaattorney"
DisplayName = "ZMongo"
Icon = "https://raw.githubusercontent.com/CentralFloridaAttorney/ComfyUI-ZMongo/master/assets/icon.png"

[tool.setuptools]
include-package-data = true
py-modules = ["__init__"]

[tool.setuptools.packages.find]
where = ["."]
exclude = [
    "js",
    "js.*",
    "web",
    "web.*",
    "example_workflows",
    "example_workflows.*",
    "assets",
    "assets.*",
    "docs",
    "docs.*"
]