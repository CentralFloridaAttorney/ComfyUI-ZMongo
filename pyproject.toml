[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zmongo"
version = "0.1.3"
description = "Advanced database framework, parameter library, and local file store persistence engine for ComfyUI."
readme = "README.md"
requires-python = ">=3.10,<3.13"
# Updated to direct string to fix setuptools deprecation warning
license = "Apache-2.0"
authors = [
    { name = "CentralFloridaAttorney" }
]

dependencies = [
    "motor>=3.4",
    "pymongo>=4.6",
    "quart>=0.19",
    "werkzeug>=3.0",
    "python-dotenv>=1.0",
    "numpy",
    "torch",
    "google-genai",
    "aiohttp",
    "langchain",
    "langchain-community",
    "bcrypt",
    "pandas",
    "FlagEmbedding",
    "transformers",
]

[project.urls]
"Repository" = "https://github.com/CentralFloridaAttorney/ComfyUI-ZMongo.git"

[tool.comfy]
PublisherId = "CentralFloridaAttorney"
DisplayName = "ZMongo"
Icon = "https://raw.githubusercontent.com/CentralFloridaAttorney/ComfyUI-ZMongo/master/assets/icon.png"

[tool.poetry]
package-mode = false

[tool.setuptools]
include-package-data = true
py-modules = ["__init__"]

# Explicitly exclude non-python directories from being compiled as packages
[tool.setuptools.packages.find]
where = ["."]
exclude = ["js", "example_workflows", "assets", "docs"]